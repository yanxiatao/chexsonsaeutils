name: 构建与回归测试

on:
  push:
    branches: ['1.21.1']
  pull_request:
    branches: ['1.21.1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: 编译、测试与资源校验
        run: ./gradlew --no-daemon --max-workers=2 build
      - name: 架构检查
        run: python -B tools/architecture/check_dependencies.py --check
      - name: 架构检查工具回归
        run: python -B -m unittest discover -s tools/architecture -p 'test_*.py' -v
      - name: 保留测试报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
