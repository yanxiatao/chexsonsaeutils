#Disable the AE2 crafting continuation / ignore-missing feature bundle. Takes effect after restart.
craftingContinuationEnabled = true
#Disable the AE2 processing pattern replacement feature bundle. Takes effect after restart.
processingPatternReplacementEnabled = true
#Disable the formal machine AE2 crafting dispatch fast path. Takes effect after restart.
formalMachineCraftingDispatchEnabled = true
#Disable the formal machine large-request planning aggregation fast path. Takes effect after restart.
formalMachinePlanningAggregationEnabled = true

[parallelCraftingCpuTool]
	#Enable the official extreme-parallel AE2 CPU tool block. Takes effect after restart.
	parallelCraftingCpuEnabled = true
	#Advertised co-processors per virtual CPU. Clamped below Integer.MAX_VALUE to avoid overflow.
	parallelCraftingCpuCoProcessorsPerVirtualCpu = 2147483646
	#Maximum internal crafting lanes per tool block.
	parallelCraftingCpuMaxInternalLanesPerBlock = 65536
	#Maximum internal crafting lanes per AE grid.
	parallelCraftingCpuMaxInternalLanesPerGrid = 1048576
	#Maximum parallel CPU job submissions accepted per grid tick.
	parallelCraftingCpuMaxSubmissionsPerTickPerGrid = 4096
	#Maximum pattern pushes budgeted per grid tick.
	parallelCraftingCpuMaxPatternPushesPerTickPerGrid = 1048576
	#Maximum provider checks budgeted per grid tick.
	parallelCraftingCpuMaxProviderChecksPerTickPerGrid = 8388608
	#Maximum wall-clock CPU scheduling budget per grid tick. Clamped to 45 ms.
	parallelCraftingCpuTickBudgetNanosPerGrid = 20000000
	#Advertised crafting storage bytes for the tool.
	parallelCraftingCpuStorageBytes = 2305843009213693951
	#Shard count used by the extreme-lane scheduler.
	parallelCraftingCpuLaneShardCount = 4096

[aeDirectProcessingMachine]
	#Local direct processing machine recipe mappings. Format: machine_id=recipe_type_id=default_ticks.
	#Example: mymod:crusher=mymod:crushing=40.
	#Only affects the AE direct processing machine discovery layer.
	recipeMappings = []
	#Execution budget profile for the AE direct processing machine.
	#Allowed values: normal, high, benchmark. Benchmark is intended for controlled performance tests.
	budgetProfile = "normal"
	#Enable generic recipe type discovery for the AE direct processing machine.
	#When disabled, only explicit adapters and config/datapack mappings are used.
	genericDiscoveryEnabled = true

[aeaMigration]
	#Enable AEA dyeable pattern migration. Takes effect after restart.
	#Default on only extends AE2 pattern color handling and must preserve existing replacement, continuation, formal-machine, and parallel CPU planning semantics.
	dyeablePatternsEnabled = true
	#Minimum amount of each dyeable recursive catalyst to keep after a crafting plan.
	#When a plan would consume the last catalyst, dyeable recursive planning crafts enough extra copies to keep this reserve available.
	dyeableRecursiveRetainedCatalystAmount = 1
	#Enable AEA enhanced crafting status migration. Takes effect after restart.
	#Default on only adds Blocked and Pattern Times status data and must not replace existing continuation, formal-machine, or parallel CPU UI state.
	enhancedCraftingStatusEnabled = true
	#Enable AEA Building Gadgets 2 template-to-processing-pattern integration. Takes effect after restart.
	#Default on has no effect unless Building Gadgets 2 is installed and must generate standard AE2 processing patterns without replacement metadata.
	buildingGadgets2IntegrationEnabled = true
	#Enable AEA FTB Ultimine memory-card compatibility. Takes effect after restart.
	#Default on has no effect unless FTB Ultimine is installed and must not change AE2 single-target memory-card behavior.
	ftbUltimineMemoryCardEnabled = true
