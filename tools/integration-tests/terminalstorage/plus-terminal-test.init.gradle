// Plus 1.6.3 与 NeoEco 真实 SDK 同时验证，默认构建仍不加载可选模组。
gradle.afterProject { project ->
    if (project != project.rootProject) return
    // Plus 的元数据对已安装 JEI 有最低版本要求；只升级此集成验收的测试依赖。
    project.dependencies.add('testImplementation', "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.plus_jei_version}")
    project.ext.neoecoSdk = true
    [project.onlineMods.extendedaePlus, project.onlineMods.neoecoae, project.onlineMods.ldlib].each {
        project.dependencies.add('testImplementation', it)
    }
    project.sourceSets.test.java.srcDir(project.file('tools/integration-tests/terminalstorage/src'))
    project.sourceSets.test.java.srcDir(project.file('tools/integration-tests/terminalstorage/plus-src'))
}
