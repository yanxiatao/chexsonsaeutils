plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of((project.java_version as String).toInteger())
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'ModMavenLocalReleases'
        url = 'https://modmaven.dev/artifactory/local-releases/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'guideme.ae2.guide.sources',
                    file('src/main/resources/assets/chexsonsaeutils/ae2guide').absolutePath
            systemProperty 'guideme.ae2.guide.sourcesNamespace', 'chexsonsaeutils'
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.chexsonsaeutils
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly files('libs/ae2ct-1.21.1-1.1.1.jar')
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    compileOnly "curse.maven:applied-mekanistics-574300:${appmek_file_id}"
    compileOnly "curse.maven:building-gadgets-298187:${building_gadgets2_file_id}"
    compileOnly "curse.maven:ftb-ultimine-forge-386134:${ftb_ultimine_file_id}"
    compileOnly files('libs/ExtendedCrafting-1.21.1-7.0.8.jar')
    // advancedae/appflux：软依赖（运行时按 ModLoaded 检测，仅编译期引用）
    compileOnly "maven.modrinth:advancedae:1.6.11-1.21.1"
    compileOnly "maven.modrinth:appflux:1.21-2.1.5-neoforge"
    // ExtendedAE_Plus：软依赖（频道卡注册，运行时按 ModLoaded 检测）。
    // 无公开 maven 坐标，jar 由 reference-sources/ExtendedAE_Plus/bin/main 编译产物打包
    // （本仓库参考源码对应版本，仅编译期引用）。
    compileOnly files('libs/extendedae_plus-1.21.1.jar')
    // ExtendedAE：必需前置（定制样板供应器 GUI 纹理与扩容物品来源）。
    // 无公开可用 maven 坐标（modrinth 镜像解析失败），jar 复制自 run/mods
    // （用户 dev 环境实际使用的有效 mod 文件），dev/测试运行时加载；
    // glodium 为 ExtendedAE 的必需依赖（ae2wtlib_api 已内嵌于 extendedae jarjar）。
    localRuntime files('libs/extendedae-1.21.1.jar')
    localRuntime files('libs/glodium-1.21.1.jar')
    localRuntime "curse.maven:architectury-api-419699:${architectury_api_file_id}"
    localRuntime "curse.maven:ftb-library-forge-404465:${ftb_library_file_id}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    localRuntime "curse.maven:applied-mekanistics-574300:${appmek_file_id}"
    localRuntime "curse.maven:building-gadgets-298187:${building_gadgets2_file_id}"
    localRuntime "curse.maven:ftb-ultimine-forge-386134:${ftb_ultimine_file_id}"

    testImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    testRuntimeOnly files('libs/extendedae-1.21.1.jar')
    testRuntimeOnly files('libs/glodium-1.21.1.jar')
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        ae2_version            : ae2_version,
        guideme_version        : guideme_version,
        mekanism_version       : mekanism_version
    ]
    inputs.properties replaceProperties
    from 'src/main/templates'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    systemProperty 'user.dir', project.projectDir.absolutePath
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'chexsonsaeutils.mixins.json'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
