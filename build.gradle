plugins {
    id 'java-library'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of((project.java_version as String).toInteger())
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
    maven {
        name = 'SleepingTown'
        url = 'https://repo.sleeping.town/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    maven {
        name = 'ModMavenLocalReleases'
        url = 'https://modmaven.dev/artifactory/local-releases/'
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'guideme.ae2.guide.sources',
                    file('src/main/resources/assets/chexsonsaeutils/ae2guide').absolutePath
            systemProperty 'guideme.ae2.guide.sourcesNamespace', 'chexsonsaeutils'
        }

        server {
            server()
            programArgument '--nogui'
        }

        replayServer {
            server()
            programArgument '--nogui'
            systemProperty 'chexsonsaeutils.replay.captureDir',
                    providers.systemProperty('chexsonsaeutils.replay.captureDir').orElse('logs').get()
            systemProperty 'chexsonsaeutils.replay.reportDir',
                    providers.systemProperty('chexsonsaeutils.replay.reportDir').orElse('logs/replay-reports').get()
            systemProperty 'chexsonsaeutils.replay.planner',
                    providers.systemProperty('chexsonsaeutils.replay.planner').orElse('linear').get()
            systemProperty 'chexsonsaeutils.replay.warmups',
                    providers.systemProperty('chexsonsaeutils.replay.warmups').orElse('2').get()
            systemProperty 'chexsonsaeutils.replay.samples',
                    providers.systemProperty('chexsonsaeutils.replay.samples').orElse('8').get()
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.chexsonsaeutils
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation 'org.spongepowered:mixin:0.8.5'

    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // 下单可选桥：以测试实例的实际公开 SDK 为基线。
    compileOnly files("reference-sources/data_energistics-1.21.1-3.1.3.jar", "reference-sources/ae2lt-2.1.1.jar")
    // neoecoae：软依赖（万象/直连机的快路径批量供应，运行时按 ModLoaded 检测，仅编译期引用）。
    // 21.2.0-beta4 起 api.me.ECOBatchCapacityProvider 的 eco$getBatchCapacity/eco$pushBatch 被删，
    // 换成 api.me.provider.ECOFastPathDispatchProvider 的单次 eco$prepareFastPath(ctx) 申报；
    // 部分类从 api.me 迁到 api.me.provider、impl.crafting.fastpath 迁到 crafting.execution.fastpath。
    compileOnly files("reference-sources/neoecoae-${neoecoae_version}.jar")
    // useless_mod：软依赖（高级合金炉的批量推送兼容，运行时按 ModLoaded 检测，仅编译期引用）。
    // 2.3.8 起才有 api.crafting.bigint 通道（BigInteger 份数批次：findTargets/capacity/admit/commit），
    // 2.3.9 的 claimOutputs 可转移真实 BigInteger 产物，因此以 2.3.9 为编译基线；jar 不入库。
    compileOnly files('reference-sources/useless_mod-1.21.1-2.3.9.jar')
    compileOnly files('libs/ae2ct-1.21.1-1.1.1.jar')
    compileOnly "maven.modrinth:kubejs:THIGFPwf"
    compileOnly "maven.modrinth:rhino:SqkDvOLG"
    testImplementation "maven.modrinth:kubejs:THIGFPwf"
    testImplementation "maven.modrinth:rhino:SqkDvOLG"
    if (project.hasProperty('kubejs')) {
        localRuntime "maven.modrinth:kubejs:THIGFPwf"
        localRuntime "maven.modrinth:rhino:SqkDvOLG"
    }
    compileOnly "maven.modrinth:justenoughcharacters:XPKoy65e"
    testImplementation "maven.modrinth:justenoughcharacters:XPKoy65e"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:1.1.22+1.21.1:api"
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"
    compileOnly "curse.maven:applied-mekanistics-574300:${appmek_file_id}"
    compileOnly "curse.maven:building-gadgets-298187:${building_gadgets2_file_id}"
    compileOnly "curse.maven:ftb-ultimine-forge-386134:${ftb_ultimine_file_id}"
    compileOnly files('libs/ExtendedCrafting-1.21.1-7.0.8.jar')
    // advancedae/appflux：软依赖（运行时按 ModLoaded 检测，仅编译期引用）
    compileOnly "maven.modrinth:advancedae:1.6.11-1.21.1"
    compileOnly "maven.modrinth:appflux:1.21-2.1.5-neoforge"
    // ExtendedAE_Plus 1.6.3：频道卡和活动库存双表精确计数，仅编译期引用。
    // 官方下载 https://modrinth.com/mod/extendedae-plus/version/AtuOmKkV
    compileOnly files('reference-sources/extendedae_plus-1.6.3.jar')
    // ExtendedAE：必需前置（定制样板供应器 GUI 纹理与扩容物品来源）。
    // 无公开可用 maven 坐标（modrinth 镜像解析失败），jar 复制自 run/mods
    // （用户 dev 环境实际使用的有效 mod 文件），dev/测试运行时加载；
    // glodium 为 ExtendedAE 的必需依赖（ae2wtlib_api 已内嵌于 extendedae jarjar）。
    localRuntime files('libs/extendedae-1.21.1.jar')
    localRuntime files('libs/glodium-1.21.1.jar')
    localRuntime "curse.maven:architectury-api-419699:${architectury_api_file_id}"
    localRuntime "curse.maven:ftb-library-forge-404465:${ftb_library_file_id}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    localRuntime "curse.maven:applied-mekanistics-574300:${appmek_file_id}"
    localRuntime "curse.maven:building-gadgets-298187:${building_gadgets2_file_id}"
    localRuntime "curse.maven:ftb-ultimine-forge-386134:${ftb_ultimine_file_id}"

    testImplementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    testImplementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    testRuntimeOnly files('libs/extendedae-1.21.1.jar')
    testRuntimeOnly files('libs/glodium-1.21.1.jar')
    testCompileOnly files("reference-sources/neoecoae-${neoecoae_version}.jar")
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
        ae2_version            : ae2_version,
        guideme_version        : guideme_version,
        mekanism_version       : mekanism_version,
        neoecoae_version       : neoecoae_version
    ]
    inputs.properties replaceProperties
    from 'src/main/templates'
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.named('test', Test).configure {
    // 度量用例（@Tag('footprint')）不进门禁：读数随 JVM/GC 波动、无容差可钉，且单条就占全量
    // 时长的一半以上（本机 43.4s / 44.2s）。要量时显式加 -Pfootprint 手工跑一次。
    useJUnitPlatform {
        if (!project.hasProperty('footprint')) {
            excludeTags 'footprint'
        }
    }
    systemProperty 'user.dir', project.projectDir.absolutePath
    // 迭代期只跑一片：-Ponly=graphplan 或 -Ponly=WideAmountConfirmLines（按 FQCN 子串匹配）。
    // 切片只用于快速反馈；收口必须不带 -Ponly 跑一次全量，否则回归看不见。
    if (project.hasProperty('only')) {
        String slice = project.property('only').toString()
        filter {
            includeTestsMatching "*${slice}*"
        }
    }
    ['plannerCompare.warmup', 'plannerCompare.samples', 'plannerCompare.retentionEvidence',
     'chexson.capture'].each { propertyName ->
        if (System.getProperty(propertyName) != null) {
            systemProperty propertyName, System.getProperty(propertyName)
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'Implementation-Vendor': mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs': 'chexsonsaeutils.mixins.json'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// 将真实 SDK 字节码放入测试模组，使其与 AE2 使用同一转换类加载器。
// 不包含 NeoEco 元数据，也不将这些类打进发布 JAR。
tasks.named('compileTestJava', JavaCompile).configure {
    inputs.file("reference-sources/neoecoae-${neoecoae_version}.jar")
    inputs.property('neoecoSdk', providers.provider { project.hasProperty('neoecoSdk') })
    doFirst {
        // 唯一删除目标固定在测试输出目录中；切换完整 SDK 验收时移除上一次默认门禁复制的类。
        if (project.hasProperty('neoecoSdk')) {
            def sdkClasses = destinationDirectory.get().asFile.toPath().resolve('cn/dancingsnow/neoecoae').normalize()
            if (!sdkClasses.startsWith(project.layout.buildDirectory.get().asFile.toPath().normalize()))
                throw new GradleException('SDK 测试输出路径越出 build 目录')
            project.delete(sdkClasses.toFile())
        }
    }
    doLast {
        // 真实集成验收加载完整 NeoEco 模组，不能再把同包类复制进本测试模组（JPMS 分包冲突）。
        if (project.hasProperty('neoecoSdk')) return
        copy {
            from(zipTree("reference-sources/neoecoae-${neoecoae_version}.jar")) {
                include 'cn/dancingsnow/neoecoae/crafting/amount/ExactAmount*.class'
                include 'cn/dancingsnow/neoecoae/api/storage/ECOBigIntegerStorage.class'
                include 'cn/dancingsnow/neoecoae/crafting/display/terminal/ExactAmountSource.class'
                include 'cn/dancingsnow/neoecoae/crafting/display/terminal/ExactAmountCollector*.class'
            }
            into destinationDirectory
        }
    }
}
